<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-r from-blue-500 to-indigo-600 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Register
        </h1>

        <form action="register.php" method="post" class="space-y-5">

            <div>
                <label class="block mb-2 font-medium text-gray-700">
                    Nama Lengkap
                </label>
                <input
                    type="text"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block mb-2 font-medium text-gray-700">
                    Username
                </label>
                <input
                    type="text"
                    name="username"
                    placeholder="Masukkan username"
                    required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block mb-2 font-medium text-gray-700">
                    Email
                </label>
                <input
                    type="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block mb-2 font-medium text-gray-700">
                    Password
                </label>
                <input
                    type="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block mb-2 font-medium text-gray-700">
                    Konfirmasi Password
                </label>
                <input
                    type="password"
                    name="konfirmasi_password"
                    placeholder="Ulangi password"
                    required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-300">
                Register
            </button>

        </form>

        <p class="text-center text-gray-600 mt-6">
            Sudah punya akun?
            <a href="login.html" class="text-blue-600 font-semibold hover:underline">
                Login
            </a>
        </p>
    </div>

</body>
</html>
